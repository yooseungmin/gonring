<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaggingBox</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 350px;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    
    .container {
      padding: 16px;
    }
    
    header {
      background-color: #4285f4;
      color: white;
      padding: 10px 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
    }

    .field-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    
    .tag {
      background-color: #e0f0ff;
      border: 1px solid #4285f4;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
    }
    
    .tag-remove {
      margin-left: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    
    .tag-input-container {
      display: flex;
      gap: 8px;
    }
    
    .tag-input-container input {
      flex-grow: 1;
    }
    
    button {
      cursor: pointer;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
    }
    
    button:hover {
      background-color: #356ac3;
    }
    
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    
    .add-tag-btn {
      white-space: nowrap;
    }
    
    .source-url {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .error-message {
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    
    .success-message {
      color: #188038;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    
    .loading:after {
      content: "...";
      animation: dots 1.5s steps(5, end) infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: "."; }
      40% { content: ".."; }
      60%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">TaggingBox</div>
  </header>
  
  <div class="container">
    <div class="source-url" id="pageUrl"></div>
    
    <div class="field-group">
      <label for="boxSelect">저장할 박스 선택:</label>
      <select id="boxSelect">
        <option value="">박스 로딩중...</option>
      </select>
    </div>
    
    <div class="field-group">
      <label for="contentTitle">제목 (선택사항):</label>
      <input type="text" id="contentTitle" placeholder="제목을 입력하세요">
    </div>
    
    <div class="field-group">
      <label for="selectedText">선택한 텍스트:</label>
      <textarea id="selectedText" placeholder="웹 페이지에서 텍스트를 선택해주세요"></textarea>
    </div>
    
    <div class="field-group">
      <label for="notes">메모 (선택사항):</label>
      <textarea id="notes" placeholder="메모를 추가하세요"></textarea>
    </div>
    
    <div class="field-group">
      <label for="tagInput">태그 (Enter 키로 추가):</label>
      <div class="tag-input-container">
        <input type="text" id="tagInput" placeholder="태그를 입력하세요">
        <button class="add-tag-btn" id="addTagButton">추가</button>
      </div>
      <div class="tag-container" id="tagContainer"></div>
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    <div class="loading" id="loading">저장 중</div>
    
    <button id="saveButton" style="width: 100%; margin-top: 12px;">저장하기</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
